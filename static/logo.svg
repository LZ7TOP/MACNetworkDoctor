<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Shield Gradient -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Dark Inner Surface Gradient -->
    <linearGradient id="surfaceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Pulse Line Glow Gradient -->
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glow Filter for Vector Elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Outer Shield Outer Ring / Glow -->
  <path d="M 256 48 
           L 416 104 
           V 256 
           C 416 352, 336 432, 256 464 
           C 176 432, 96 352, 96 256 
           V 104 
           Z" 
        fill="none" 
        stroke="url(#shieldGradient)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"
        opacity="0.6"/>

  <!-- Main Shield Body -->
  <path d="M 256 48 
           L 416 104 
           V 256 
           C 416 352, 336 432, 256 464 
           C 176 432, 96 352, 96 256 
           V 104 
           Z" 
        fill="url(#surfaceGradient)" 
        stroke="url(#shieldGradient)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Network Circuit Lines / Node Mesh -->
  <g opacity="0.25" stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="160" y1="160" x2="352" y2="160" />
    <line x1="140" y1="256" x2="372" y2="256" />
    <line x1="180" y1="352" x2="332" y2="352" />
    <line x1="256" y1="100" x2="256" y2="400" />
  </g>

  <!-- Diagnostic Activity Pulse Wave -->
  <path d="M 128 256 
           L 184 256 
           L 216 184 
           L 248 328 
           L 280 216 
           L 304 280 
           L 328 256 
           L 384 256" 
        fill="none" 
        stroke="url(#pulseGradient)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Shiny Core Pulse Nodes -->
  <circle cx="216" cy="184" r="7" fill="#60a5fa"/>
  <circle cx="248" cy="328" r="7" fill="#38bdf8"/>
  <circle cx="280" cy="216" r="7" fill="#c084fc"/>

  <!-- Stethoscope / Mac Medical Cross Accent -->
  <g transform="translate(256, 124)">
    <circle cx="0" cy="0" r="16" fill="url(#shieldGradient)"/>
    <path d="M -6 0 H 6 M 0 -6 V 6" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
